name: fish profile

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fish-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx playwright install chromium

      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Update fish media
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FISH_SECONDS: "60"
          FISH_FPS: "8"
        run: node scripts/update-media.mjs

      - name: Commit fish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/fish.webp assets/fish.gif
          if git diff --cached --quiet; then
            echo "No fish changes"
            exit 0
          fi
          git commit -m "chore: update fish profile"
          git push
